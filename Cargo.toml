[package]
name = "terminal-emulator"
version = "0.1.0"
edition = "2021"
description = "Lightweight borderless terminal emulator (GTK4 + VTE)"

[dependencies]
gtk4 = "0.9"
vte4 = "0.8"
glib = "0.20"
pango = "0.20"
gdk4-wayland = { version = "0.9", features = ["wayland_crate"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

[build-dependencies]
pkg-config = "0.3"
