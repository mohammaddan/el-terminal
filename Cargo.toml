[package]
name = "terminal-emulator"
version = "0.1.0"
edition = "2021"
description = "Lightweight borderless terminal emulator (GTK4 + VTE)"
license = "MIT"
authors = ["mohammaddan"]
homepage = "https://github.com/mohammaddan/el-terminal"
repository = "https://github.com/mohammaddan/el-terminal"

[package.metadata.deb]
name = "terminal-emulator"
maintainer = "mohammaddan <https://github.com/mohammaddan>"
section = "utils"
priority = "optional"
extended-description = """\
Lightweight borderless terminal emulator built with GTK4 and VTE. \
Supports multi-tab sessions, split panes, themes, and optional Ask AI."""
depends = "$auto"
assets = [
    ["target/release/terminal-emulator", "usr/bin/", "755"],
    ["packaging/terminal-emulator.desktop", "usr/share/applications/", "644"],
]

[dependencies]
gtk4 = "0.9"
vte4 = { version = "0.8", features = ["v0_72"] }
glib = "0.20"
pango = "0.20"
gdk4-wayland = { version = "0.9", features = ["wayland_crate"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.3.0"
dirs = "6.0.0"

[build-dependencies]
pkg-config = "0.3"
