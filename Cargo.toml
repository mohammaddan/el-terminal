[package]
name = "el-terminal"
version = "1.1.0"
edition = "2021"
description = "El-Terminal — lightweight borderless terminal emulator (GTK4 + VTE)"
license = "MIT"
authors = ["mohammaddan"]
homepage = "https://github.com/mohammaddan/el-terminal"
repository = "https://github.com/mohammaddan/el-terminal"

[package.metadata.deb]
name = "el-terminal"
maintainer = "mohammaddan <https://github.com/mohammaddan>"
section = "utils"
priority = "optional"
extended-description = """\
El-Terminal is a lightweight borderless terminal emulator built with GTK4 and VTE. \
Supports multi-tab sessions, split panes, themes, and optional Ask AI."""
depends = "$auto"
recommends = "el-terminal-nautilus"
maintainer-scripts = "packaging/debian/"
assets = [
    [
        "target/release/el-terminal",
        "usr/bin/",
        "755",
    ],
    [
        "packaging/el-terminal.desktop",
        "usr/share/applications/",
        "644",
    ],
    [
        "packaging/el-terminal.png",
        "usr/share/icons/hicolor/512x512/apps/el-terminal.png",
        "644",
    ],
    [
        "packaging/el-terminal.png",
        "usr/share/pixmaps/el-terminal.png",
        "644",
    ],
    [
        "packaging/xdg-terminals.list.example",
        "usr/share/doc/el-terminal/",
        "644",
    ],
    [
        "themes/*",
        "usr/share/el-terminal/themes/",
        "644",
    ],
]

[package.metadata.deb.variants.nautilus]
name = "el-terminal-nautilus"
section = "gnome"
priority = "optional"
depends = "el-terminal, python3-nautilus"
recommends = ""
extended-description = """\
Nautilus (Files) context-menu extension that adds \
“Open in El-Terminal” and launches el-terminal with --working-directory."""
maintainer-scripts = "packaging/debian-nautilus/"
assets = [
    [
        "packaging/nautilus/el_terminal_nautilus.py",
        "usr/share/nautilus-python/extensions/",
        "644",
    ],
]

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
vte4 = { version = "0.8", features = ["v0_72"] }
glib = "0.20"
pango = "0.20"
gdk4-wayland = { version = "0.9", features = ["wayland_crate"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.3.0"
dirs = "6.0.0"

[build-dependencies]
pkg-config = "0.3"
